services:
  - type: web
    name: pricefinder-bd-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/seed_sample_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./pricefinder_dev.db
